name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tripwise
          POSTGRES_PASSWORD: tripwise
          POSTGRES_DB: tripwise_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tripwise"
          --health-interval 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://tripwise:tripwise@localhost:5432/tripwise_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter "./packages/**" build
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
